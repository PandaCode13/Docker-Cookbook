server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # "backend" est le NOM DU SERVICE défini dans docker-compose.yml.
    # Docker Compose crée un réseau interne où chaque service est résolu par son nom,
    # comme un vrai nom d'hôte DNS — pas besoin d'IP ni de "localhost" ici,
    # car nginx et l'API tournent dans deux conteneurs séparés.
    location /api/ {
        proxy_pass http://backend:3001/api/;
    }
}