server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le processus Node qui tourne dans le MÊME conteneur, sur localhost:3001
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
    }
}